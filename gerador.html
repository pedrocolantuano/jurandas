<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de RDO</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#d9dde5;--ac:#1f6fd1;--acx:#fff;--dg:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--tx:#e8ebf1;--mut:#9aa3b5;--bd:#333a48;--ac:#4a93f0;--acx:#0b1220;--dg:#ff7b6b}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--tx:#e8ebf1;--mut:#9aa3b5;--bd:#333a48;--ac:#4a93f0;--acx:#0b1220;--dg:#ff7b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 10px}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:8px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.r{display:grid;gap:6px;margin-bottom:6px;align-items:center}
.r.e{grid-template-columns:1fr 70px 34px}.r.a{grid-template-columns:2fr 60px 70px 1.2fr 34px}
@media(max-width:560px){.r.a{grid-template-columns:1fr 1fr 34px}.r.a input:first-child{grid-column:1/-1}.r.a input:nth-child(4){grid-column:1/3}}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px}
button.x{color:var(--dg);padding:8px 0}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600;padding:12px 18px;width:100%;font-size:16px}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.ph div{position:relative}.ph img{width:100%;height:100px;object-fit:cover;border-radius:7px;border:1px solid var(--bd)}
.ph button{position:absolute;top:3px;right:3px;padding:1px 7px;line-height:1.3}
#msg{margin:8px 0 0;font-size:13px;color:var(--mut);min-height:18px}
</style></head><body><main>
<h1>Gerador de RDO — Relatório Diário de Obra</h1>

<section><h2>Nome do arquivo</h2><label>Nome para salvar (ex.: RDO 15-10 Obra Centro)<input id="nome" placeholder="deixe em branco para usar RDO_diames"></label></section>

<section><h2>Dados diários</h2><div class="g">
<label>Data<input type="date" id="data"></label>
<label style="grid-column:span 2">Local<input id="local"></label></div>
<div class="g" style="margin-top:10px">
<label>Tempo (manhã)<select id="tm"><option>Bom</option><option>Chuvoso</option></select></label>
<label>Tempo (tarde)<select id="tt"><option>Bom</option><option>Chuvoso</option></select></label></div></section>

<section><h2>Efetivo (função / quantidade)</h2><div id="efe"></div><button data-add="efe">+ Adicionar função</button></section>
<section><h2>Equipamentos (descrição / quantidade)</h2><div id="equ"></div><button data-add="equ">+ Adicionar equipamento</button></section>
<section><h2>Atividades diárias (descrição / unid. / produção / local)</h2><div id="ati"></div><button data-add="ati">+ Adicionar atividade</button></section>
<section><h2>Observações</h2><textarea id="obs" placeholder="Uma observação por linha"></textarea></section>
<section><h2>Fotos</h2><input type="file" id="fotos" accept="image/*" multiple><div class="ph" id="ph"></div></section>

<button class="p" id="go">Gerar planilha (.xlsx)</button><p id="msg"></p>
</main>

const KEY="rdo_padrao";

function addRow(id,v=[]){
  const s=spec[id],d=document.createElement("div");d.className="r "+s.c;
  s.ph.forEach((p,i)=>{const e=document.createElement("input");e.placeholder=p;e.value=v[i]??"";if(s.n.includes(i)&&id==="efe"||(id==="equ"&&i===1)){e.type="number";e.min=0}d.append(e)});

const rows=id=>[...$("#"+id).children].map(d=>[...d.querySelectorAll("input")].map(i=>i.value.trim())).filter(r=>r.some(Boolean));

let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
if(st.local)$("#local").value=st.local;
(st.efe||[["Pedreiro Jose",1],["Técnico de Segurança (Jurandir)",1]]).forEach(r=>addRow("efe",r));
(st.equ||[]).forEach(r=>addRow("equ",r));

let fotos=[];
function draw(){const p=$("#ph");p.innerHTML="";fotos.forEach((f,i)=>{const d=document.createElement("div"),im=new Image();im.src=f.url;const b=document.createElement("button");b.textContent="✕";b.onclick=()=>{fotos.splice(i,1);draw()};d.append(im,b);p.append(d)})}
function reduz(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);URL.revokeObjectURL(u);ok({url:c.toDataURL("image/jpeg",.85),w,h})};im.onerror=no;im.src=u})}
$("#fotos").onchange=async e=>{for(const f of e.target.files){try{fotos.push(await reduz(f))}catch(x){}}e.target.value="";draw()};

const msg=t=>$("#msg").textContent=t;

async function gerar(){

      ws.getRow(r).height=230;
      for(let j=0;j<2&&i+j<fotos.length;j++){
        const f=fotos[i+j],c0=j*4;put(r,c0+1,r,c0+4,"");
        const k=Math.min(420/f.w,300/f.h),w=f.w*k,h=f.h*k;
        ws.addImage(wb.addImage({base64:f.url,extension:"jpeg"}),{tl:{col:c0+(440-w)/2/110,row:r-1+(307-h)/2/307},ext:{width:w,height:h}});
      }
      if(i+1>=fotos.length)put(r,5,r,8,"");
      r++;
    }
  }
  r++;put(r,1,r,4,"Responsável Contratante",{b:1,f:G});put(r,5,r,8,"Responsável Contratada",{b:1,f:G});
  put(r+1,1,r+3,4,"");put(r+1,5,r+3,8,"");

  try{localStorage.setItem(KEY,JSON.stringify({local:$("#local").value,efe:ef,equ:eq}))}catch(e){}
  const buf=await wb.xlsx.writeBuffer(),nome=($("#nome").value.replace(/[\\/:*?"<>|]/g," ").replace(/\.xlsx$/i,"").trim()||"RDO_"+String(D).padStart(2,"0")+String(M).padStart(2,"0"))+".xlsx";
  // Download compatível com navegadores comuns (Chrome, Edge, Firefox).
  // Não depende da API específica "claude.use".
  const blob = new Blob([buf], {
    type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = nome;
  link.style.display = "none";
  document.body.appendChild(link);
  link.click();
  link.remove();

  // Revoga a URL depois de o navegador iniciar o download.
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  msg("Arquivo gerado. Verifique a pasta de downloads do navegador.");
}
$("#go").onclick=()=>gerar().catch(e=>msg("Erro ao gerar: "+(e&&e.message||e)));
</script></body></html>
